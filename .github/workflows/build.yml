name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      # android/ papkada ba'zi fayllar yo'q bo'lsa, shu yerda to'ldiriladi.
      # Mavjud fayllar (masalan bizning maxsus AndroidManifest.xml'imiz) ustidan yozilmaydi.
      - name: Fill in missing android project files
        run: flutter create --platforms=android .

      # geocoding, google_maps_flutter, androidx.* kutubxonalari compileSdk >= 34 talab qiladi.
      # Ko'plab plagin NDK 27.0.12077973 talab qiladi.
      - name: Fix compileSdk / targetSdk / minSdk / ndkVersion
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 36/' "$FILE"
            sed -i -E 's/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 34/' "$FILE"
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/' "$FILE"
            sed -i -E 's/ndkVersion\s*=\s*flutter\.ndkVersion/ndkVersion = "27.0.12077973"/' "$FILE"
          fi
          if [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
            sed -i -E 's/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 36/' "$FILE"
            sed -i -E 's/targetSdkVersion\s+flutter\.targetSdkVersion/targetSdkVersion 34/' "$FILE"
            sed -i -E 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/' "$FILE"
            sed -i -E 's/ndkVersion\s+flutter\.ndkVersion/ndkVersion "27.0.12077973"/' "$FILE"
          fi
          echo "----- Natija -----"
          grep -n -i "sdk\|ndk" android/app/build.gradle* || true

      # AndroidManifest.xml ichida ${GOOGLE_MAPS_API_KEY} placeholder bor.
      # Uni GitHub Secrets'dagi qiymat bilan almashtirish uchun manifestPlaceholders qo'shamiz.
      - name: Inject Google Maps API key placeholder
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            FILE=android/app/build.gradle.kts
            if ! grep -q "manifestPlaceholders" "$FILE"; then
              sed -i -E '/defaultConfig\s*\{/a\        manifestPlaceholders["GOOGLE_MAPS_API_KEY"] = System.getenv("GOOGLE_MAPS_API_KEY") ?: ""' "$FILE"
            fi
          fi
          if [ -f android/app/build.gradle ]; then
            FILE=android/app/build.gradle
            if ! grep -q "manifestPlaceholders" "$FILE"; then
              sed -i -E '/defaultConfig\s*\{/a\        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: System.getenv("GOOGLE_MAPS_API_KEY") ?: ""]' "$FILE"
            fi
          fi
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uzum-tezkor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
